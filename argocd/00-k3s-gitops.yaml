apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-gitops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/thawatchai-rvc/k3s-gitops.git
    targetRevision: HEAD
    path: argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd